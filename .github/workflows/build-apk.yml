name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        # Проект лежит во вложенной папке
        working-directory: KbzhuTracker/KbzhuTracker
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Android SDK уже установлен на серверах GitHub (ANDROID_HOME).
      # Принимаем лицензии и докачиваем платформу 36 штатным sdkmanager.
      - name: Android SDK 36
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - run: gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: kbzhu-tracker-debug-apk
          path: KbzhuTracker/KbzhuTracker/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Отчёты, если сборка упала
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: KbzhuTracker/KbzhuTracker/app/build/reports/
          if-no-files-found: ignore
